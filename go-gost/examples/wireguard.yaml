# Replace these placeholders with a peer configuration issued by your server.
# The server must allow 10.77.0.2/32 for this client's public key.
services:
  - name: wg-tcp-forward
    addr: 127.0.0.1:18080
    listener:
      type: tcp
    handler:
      type: tcp
      chain: wireguard-out
    forwarder:
      nodes:
        - name: target
          addr: 10.77.0.1:8080
  - name: wg-udp-forward
    addr: 127.0.0.1:15353
    listener:
      type: udp
    handler:
      type: udp
      chain: wireguard-out
    forwarder:
      nodes:
        - name: dns-target
          addr: 10.77.0.1:53
chains:
  - name: wireguard-out
    hops:
      - name: wg-peer
        nodes:
          - name: wireguard-server
            addr: 198.51.100.10:51820
            connector:
              type: wg
            dialer:
              type: wg
              metadata:
                privateKey: REPLACE_WITH_CLIENT_PRIVATE_KEY_BASE64
                publicKey: REPLACE_WITH_SERVER_PUBLIC_KEY_BASE64
                # presharedKey: REPLACE_IF_THE_SERVER_USES_A_PRESHARED_KEY
                address: [10.77.0.2/32]
                allowedIPs: [10.77.0.0/24]
                dns: [10.77.0.1]
                mtu: 1420
                keepalive: 25
                dialTimeout: 5s
